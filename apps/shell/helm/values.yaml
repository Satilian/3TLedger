replicaCount: 1

image:
  repository: ghcr.io/satilian/3tledger-shell
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  host: ""
  certResolver: myresolver

config:
  NODE_ENV: production
  PORT: 3000
  AUTH_GATEWAY_URL: http://api-gateway-3tledger
  SSR_CACHE_ENABLED: false

imagePullSecrets: []
