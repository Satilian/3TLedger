name: Backend

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

concurrency:
  group: release-backend-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: ${{ inputs.app }}
  NAMESPACE: 3tledger
  IMAGE_PULL_SECRET: ghcr-pull-secret

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.repository }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image
        id: image
        run: |
          case "$APP" in
            api-gateway|identity-api|profile-api|ledger-api|budgets-api|analytics-api|notifications-api) ;;
            *) exit 1 ;;
          esac
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}-$APP" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./apps/${{ inputs.app }}
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v5

      - name: Configure Kubernetes access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          mkdir -p ~/.kube
          printf '%s\n' "$KUBECONFIG_CONTENT" > ~/.kube/config

      - name: Configure GHCR pull secret
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry "$IMAGE_PULL_SECRET" \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PAT" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        env:
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          BACKEND_API_HOST: ${{ vars.BACKEND_API_HOST }}
          APP_HOST: ${{ vars.APP_HOST }}
          IDENTITY_ENV_SECRET: ${{ vars.IDENTITY_ENV_SECRET }}
          PROFILE_ENV_SECRET: ${{ vars.PROFILE_ENV_SECRET }}
          KAFKA_ENV_SECRET: ${{ vars.KAFKA_ENV_SECRET }}
        run: |
          app_args=()
          if [[ "$APP" == api-gateway && -n "$BACKEND_API_HOST" ]]; then
            if [[ ! "$BACKEND_API_HOST" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
              echo "::error::BACKEND_API_HOST must be a DNS hostname."
              exit 1
            fi
            app_args=(--set ingress.enabled=true --set-string "ingress.host=$BACKEND_API_HOST")
          fi
          if [[ "$APP" == identity-api && -n "$IDENTITY_ENV_SECRET" ]]; then
            if [[ ! "$IDENTITY_ENV_SECRET" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
              echo "::error::IDENTITY_ENV_SECRET must be a Kubernetes Secret name."
              exit 1
            fi
            app_args=(--set-string "existingSecret=$IDENTITY_ENV_SECRET")
          fi

          case "$APP" in
            profile-api)
              if [[ ! "$PROFILE_ENV_SECRET" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
                echo "::error::Set PROFILE_ENV_SECRET to the Kubernetes Secret name for profile-api."
                exit 1
              fi
              if [[ ! "$APP_HOST" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
                echo "::error::Set APP_HOST to the production DNS hostname."
                exit 1
              fi
              app_args+=(--set-string "existingSecret=$PROFILE_ENV_SECRET" --set-string "publicBaseURL=https://$APP_HOST")
              ;;
            ledger-api|budgets-api|analytics-api|notifications-api)
              if [[ -n "$KAFKA_ENV_SECRET" ]]; then
                if [[ ! "$KAFKA_ENV_SECRET" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
                  echo "::error::KAFKA_ENV_SECRET must be a Kubernetes Secret name."
                  exit 1
                fi
                app_args+=(--set-string "kafkaEnvSecret=$KAFKA_ENV_SECRET")
              fi
              ;;
          esac

          helm upgrade --install "$APP-3tledger" "./apps/$APP/helm" \
            --namespace "$NAMESPACE" \
            --wait \
            --timeout 300s \
            --rollback-on-failure \
            --set-string "imagePullSecrets[0].name=$IMAGE_PULL_SECRET" \
            --set-string "image.repository=$IMAGE_REPOSITORY" \
            --set-string "image.tag=$IMAGE_TAG" \
            "${app_args[@]}"
